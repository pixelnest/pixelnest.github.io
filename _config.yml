title: "Pixelnest Studio"
description: "Pixelnest Studio is Damien Mayance & Eddy Margueron, a two-person indie studio. We make our own games and offer freelance Unity development, tech art, VFX and 3D."

google_tracking_code: "UA-40226469-1"

repository: "pixelnest/pixelnest.github.io"

# -------------------------------------------------------
# Globals.
# -------------------------------------------------------

show_drafts: nil
permalink: /:categories/:year/:month/:title/

include: ['_pages']

exclude:
  - 'README.md'
  - 'LICENSE'
  - 'Gemfile'
  - 'Gemfile.lock'
  - 'package.json'
  - 'package-lock.json'
  - 'node_modules'
  - 'update_presskit'

# -------------------------------------------------------
# Collections.
# -------------------------------------------------------

collections:
  games:
    output: true
    permalink: /games/:path/
  services:
    output: false

# -------------------------------------------------------
# Defaults.
# -------------------------------------------------------

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "games"
    values:
      layout: "product"

# -------------------------------------------------------
# Markdown.
# -------------------------------------------------------

kramdown:
  input: GFM
  parse_block_html: true
  parse_span_html: true

# -------------------------------------------------------
# Code.
# -------------------------------------------------------

highlighter: rouge

# -------------------------------------------------------
# Pagination.
# -------------------------------------------------------

paginate_path: '/journal/:num/'
paginate: 4

# -------------------------------------------------------
# Plugins.
# -------------------------------------------------------

plugins:
  - jekyll-paginate
  - jekyll-redirect-from
